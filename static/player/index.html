<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamBridge Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0e0e10; color:#fff; font-family:system-ui,sans-serif; }
  header { padding:14px 20px; display:flex; gap:10px; flex-wrap:wrap;
           background:#18181b; align-items:center; }
  select,input,button { padding:8px 12px; border-radius:6px; border:1px solid #333;
           background:#26262c; color:#fff; font-size:14px; }
  button { background:#9147ff; border:none; cursor:pointer; font-weight:600; }
  button:hover { background:#772ce8; }
  #smartInput { flex:1; min-width:280px; }
  #status { padding:8px 20px; font-size:13px; color:#aaa; }
  #status .live { color:#eb0400; font-weight:700; }
  video { width:100%; max-height:calc(100vh - 120px); background:#000; }
  #variantBar { display:none; }
  #playerShell { position:relative; background:#000; }
  #settings { margin:0 20px 10px; padding:12px; max-width:720px; border:1px solid #333;
    border-radius:8px; background:#18181b; font-size:13px; }
  #settings[hidden] { display:none; }
  #settings label { display:inline-flex; align-items:center; gap:6px; margin:6px 14px 6px 0; }
  #settings input { width:72px; padding:5px 7px; }
  #settings .hint { display:block; color:#aaa; margin-top:6px; }
  #qualityBox { position:absolute; top:12px; right:12px; z-index:3; min-width:148px;
    padding:7px 9px; color:#fff; background:rgba(20,20,24,.9); border:1px solid #666;
    border-radius:7px; font-size:13px; backdrop-filter:blur(6px); }
  #qualityBox:focus { outline:2px solid #9147ff; }
  #playerStats { position:absolute; top:12px; left:12px; z-index:3; max-width:65%; padding:7px 9px;
    color:#eee; background:rgba(20,20,24,.82); border:1px solid #555; border-radius:7px;
    font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; backdrop-filter:blur(6px); }
  #playerStats[hidden] { display:none; }
  #suggestions { position:absolute; top:calc(100% - 1px); left:20px; right:20px; z-index:8;
    max-height:360px; overflow:auto; border:1px solid #444; border-radius:0 0 8px 8px;
    background:#18181b; box-shadow:0 10px 24px rgba(0,0,0,.45); }
  #suggestions[hidden] { display:none; }
  .suggestion { display:flex; justify-content:space-between; gap:12px; width:100%; padding:10px 12px;
    color:#fff; background:transparent; border:0; border-bottom:1px solid #303035; text-align:left; }
  .suggestion:hover { background:#303036; }.suggestion small { color:#aaa; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <strong>StreamBridge</strong>
  <input id="smartInput" placeholder="Link veya kanal adı yapıştır — twitch / kick / youtube otomatik tanınır">
  <div id="suggestions" hidden role="listbox" aria-label="Platform önerileri"></div>
  <button onclick="playSmart()">Oynat</button>
  <select id="platform">
    <option value="kick">Kick</option>
    <option value="twitch">Twitch</option>
    <option value="youtube">YouTube</option>
  </select>
  <input id="channel" placeholder="kanal adi / @handle / video id" size="28">
  <button onclick="loadStream()">Izle</button>
  <button onclick="checkStatus()">Durum</button>
  <button id="settingsToggle" type="button">Ayarlar</button>
</header>
<div id="status"></div>
<div id="variantBar"></div>
<section id="settings" hidden aria-label="Oynatma ayarları">
  <strong>Oynatma ayarları</strong>
  <label>Profil
    <select id="hlsProfile"><option value="default">Varsayılan</option><option value="stable">Stabil</option><option value="custom">Kişisel</option></select>
  </label>
  <label>Canlı senkron (segment) <input id="liveSync" type="number" min="1" max="10" step="1"></label>
  <label>Azami gecikme (segment) <input id="liveMax" type="number" min="2" max="20" step="1"></label>
  <label>İleri tampon (sn) <input id="maxBuffer" type="number" min="5" max="120" step="1"></label>
  <label>Geri tampon (sn) <input id="backBuffer" type="number" min="10" max="300" step="1"></label>
  <button id="saveSettings" type="button">Kaydet</button>
  <span class="hint">Varsayılan mevcut davranışı korur. Stabil profil: 3/6 segment, 30 sn ileri ve 60 sn geri tampon.</span>
</section>
<div id="playerShell"><video id="video" controls autoplay muted></video><div id="playerStats" aria-live="polite" hidden></div><select id="qualityBox" aria-label="Çözünürlük ve kalite" hidden><option value="master">Otomatik kalite</option></select></div>

<script>
const $ = id => document.getElementById(id);
let hls = null;
let currentStream = null;
let suggestionTimer = null;
let statsTimer = null;
const HLS_DEFAULT = { profile: 'default', liveSync: 3, liveMax: '', maxBuffer: '', backBuffer: '' };
const HLS_STABLE = { profile: 'stable', liveSync: 3, liveMax: 6, maxBuffer: 30, backBuffer: 60 };

function readHlsSettings() {
  try { return { ...HLS_DEFAULT, ...JSON.parse(localStorage.getItem('streambridge.hlsSettings') || '{}') }; }
  catch (_) { return { ...HLS_DEFAULT }; }
}
function writeHlsSettings(settings) {
  localStorage.setItem('streambridge.hlsSettings', JSON.stringify(settings));
}
function renderHlsSettings() {
  const settings = readHlsSettings();
  $('hlsProfile').value = settings.profile;
  $('liveSync').value = settings.liveSync;
  $('liveMax').value = settings.liveMax;
  $('maxBuffer').value = settings.maxBuffer;
  $('backBuffer').value = settings.backBuffer;
}
function applyProfile(profile) {
  const values = profile === 'stable' ? HLS_STABLE : HLS_DEFAULT;
  $('liveSync').value = values.liveSync;
  $('liveMax').value = values.liveMax;
  $('maxBuffer').value = values.maxBuffer;
  $('backBuffer').value = values.backBuffer;
}
function hlsConfig() {
  const s = readHlsSettings();
  const config = { enableWorker: true, lowLatencyMode: false, liveSyncDurationCount: Number(s.liveSync) || 3 };
  const liveMax = Number(s.liveMax);
  if (liveMax > config.liveSyncDurationCount) config.liveMaxLatencyDurationCount = liveMax;
  const maxBuffer = Number(s.maxBuffer);
  if (maxBuffer > 0) { config.maxBufferLength = maxBuffer; config.maxMaxBufferLength = Math.max(maxBuffer * 2, 60); }
  const backBuffer = Number(s.backBuffer);
  if (backBuffer > 0) config.backBufferLength = backBuffer;
  return config;
}
function updatePlayerStats() {
  const box = $('playerStats'), video = $('video');
  if (!hls || !currentStream) { box.hidden = true; return; }
  const level = hls.levels?.[hls.currentLevel] || hls.levels?.[hls.loadLevel] || null;
  const quality = level ? `${level.height || '?'}p · ${Math.round((level.bitrate || 0) / 1000)} kbps` : 'Otomatik';
  const buffered = video.buffered.length ? Math.max(0, video.buffered.end(video.buffered.length - 1) - video.currentTime) : 0;
  const latency = Number.isFinite(hls.latency) ? `${hls.latency.toFixed(1)} sn` : '—';
  const viewers = currentStream.viewers ? `${Number(currentStream.viewers).toLocaleString('tr-TR')} izleyici` : 'izleyici: —';
  const selected = $('qualityBox').selectedOptions[0]?.textContent || 'Otomatik kalite';
  const throughput = Number(hls.bandwidthEstimate);
  const network = Number.isFinite(throughput) && throughput > 0 ? `${formatBitrate(throughput)} ağ` : 'ağ: ölçülüyor';
  const source = `${currentStream.platform || $('platform').value} / ${currentStream.channel || $('channel').value}`;
  box.textContent = `${source} | Seçim: ${selected} | Akış: ${quality} | ${network} | Tampon: ${buffered.toFixed(1)} sn | Gecikme: ${latency} | ${viewers}`;
  box.hidden = false;
}
function formatBitrate(bitsPerSecond) {
  if (bitsPerSecond >= 1e9) return `${(bitsPerSecond / 1e9).toFixed(2)} Gbps`;
  if (bitsPerSecond >= 1e6) return `${(bitsPerSecond / 1e6).toFixed(2)} Mbps`;
  return `${Math.round(bitsPerSecond / 1e3)} Kbps`;
}
function startPlayerStats() {
  clearInterval(statsTimer); updatePlayerStats(); statsTimer = setInterval(updatePlayerStats, 1000);
}

/* ---------- AKILLI LINK COZUMLEME ---------- */

async function detectLivePlatform(channel, preferredPlatform) {
  // Düz kanal adında kullanıcının seçimi önceliklidir; sonra diğer platform denenir.
  const platforms = [preferredPlatform, ...["twitch", "kick"].filter(p => p !== preferredPlatform)];
  for (const p of platforms) {
    try {
      const s = await fetch(`/api/status/${p}/${channel}`).then(x => x.json());
      if (s.is_live) return p;
    } catch (e) {}
  }
  return "twitch"; // ikisi de cevrimdisiysa varsayilan
}

async function playSmart(text) {
  text = (text ?? $("smartInput").value).trim();
  if (!text) return;
  $("status").textContent = "Link çözümleniyor...";

  const res = await fetch("/api/resolve?url=" + encodeURIComponent(text));
  if (!res.ok) { $("status").textContent = "Link tanınamadı."; return; }
  const r = await res.json();

  let platform = r.platform;
  if (platform === "auto") platform = await detectLivePlatform(r.channel, $("platform").value);

  // VOD linkleri simdilik desteklenmiyor
  if (r.kind === "video" && platform !== "youtube") {
    $("status").textContent = "VOD desteği henüz yok — canlı yayın linki verin.";
    return;
  }

  $("platform").value = platform;
  $("channel").value = r.channel ?? r.video_id;
  await loadStream();
}

// Enter tusu ile de oynat
$("smartInput").addEventListener("keydown", e => {
  if (e.key === "Enter") playSmart();
});
$("smartInput").addEventListener("input", () => {
  clearTimeout(suggestionTimer);
  suggestionTimer = setTimeout(updateSuggestions, 280);
});
$("smartInput").addEventListener("blur", () => setTimeout(() => { $("suggestions").hidden = true; }, 180));

function platformSearchUrl(platform, query) {
  const encoded = encodeURIComponent(query);
  return platform === 'bilibili' ? `https://search.bilibili.com/all?keyword=${encoded}`
    : `https://www.dailymotion.com/search/${encoded}/videos`;
}
async function updateSuggestions() {
  const query = $("smartInput").value.trim();
  const box = $("suggestions");
  box.replaceChildren();
  if (query.length < 2) { box.hidden = true; return; }
  let found = [];
  try {
    const response = await fetch(`/api/search/suggestions?q=${encodeURIComponent(query)}&limit=20`);
    if (response.ok) found = (await response.json()).results || [];
  } catch (_) {}
  const fallback = ['twitch', 'kick', 'youtube', 'bilibili', 'dailymotion'].map(platform => ({
    platform, channel: query, title: `${platform} üzerinde “${query}” ara`, external: ['bilibili', 'dailymotion'].includes(platform)
  }));
  const unique = [...found, ...fallback].filter((item, index, all) =>
    index === all.findIndex(other => other.platform === item.platform && other.channel === item.channel)).slice(0, 20);
  unique.forEach(item => {
    const button = document.createElement('button');
    button.className = 'suggestion'; button.type = 'button'; button.setAttribute('role', 'option');
    button.append(document.createTextNode(item.title || item.channel));
    const tag = document.createElement('small');
    tag.textContent = item.external ? item.platform : `${item.platform} · ${item.is_live ? 'CANLI' : 'durum kontrol edildi'}${item.viewers ? ` · ${Number(item.viewers).toLocaleString('tr-TR')} izleyici` : ''}`;
    button.appendChild(tag);
    button.addEventListener('mousedown', event => event.preventDefault());
    button.addEventListener('click', () => {
      box.hidden = true;
      if (item.external) { window.open(platformSearchUrl(item.platform, item.channel), '_blank', 'noopener'); return; }
      $("platform").value = item.platform; $("channel").value = item.channel; $("smartInput").value = item.channel;
      setStatus(`${item.platform} · ${item.channel} · ${item.is_live ? 'CANLI' : 'durum kontrol edildi'}${item.viewers ? ` · ${Number(item.viewers).toLocaleString('tr-TR')} izleyici` : ''}`);
      loadStream();
    });
    box.appendChild(button);
  });
  box.hidden = unique.length === 0;
}

// Sayfa ?url= ile acildiysa (tarayici eklentisi buraya yonlendirir) otomatik oynat
// Sayfa parametre ile acildiysa (tarayici eklentisi buraya yonlendirir) otomatik oynat
window.addEventListener("DOMContentLoaded", () => {
  renderHlsSettings();
  $('settingsToggle').addEventListener('click', () => { $('settings').hidden = !$('settings').hidden; });
  $('hlsProfile').addEventListener('change', event => applyProfile(event.target.value));
  $('saveSettings').addEventListener('click', () => {
    const profile = $('hlsProfile').value;
    const saved = { profile, liveSync: $('liveSync').value, liveMax: $('liveMax').value,
      maxBuffer: $('maxBuffer').value, backBuffer: $('backBuffer').value };
    writeHlsSettings(saved);
    setStatus('Oynatma ayarları kaydedildi. Bir sonraki yayında uygulanır.');
  });
  const q = new URLSearchParams(location.search);
  const pUrl = q.get("url");
  const pPlatform = q.get("platform");
  const pChannel = q.get("channel");
  const pVideo = q.get("video");

  if (pUrl) {
    // ?url=... -> akilli cozumleme
    $("smartInput").value = pUrl;
    playSmart(pUrl);
  } else if (pPlatform && pChannel) {
    // ?platform=twitch&channel=shroud -> dogrudan oynat
    $("platform").value = pPlatform;
    $("channel").value = pChannel;
    loadStream();
  } else if (pPlatform === "youtube" && pVideo) {
    // ?platform=youtube&video=VIDEO_ID
    $("platform").value = "youtube";
    $("channel").value = pVideo;
    loadStream();
  }
});

/* ---------- MEVCUT PLAYER ---------- */

async function checkStatus() {
  const p = $("platform").value, c = $("channel").value.trim();
  if (!c) return;
  const r = await fetch(`/api/status/${p}/${c}`).then(r => r.json());
  setStatus(r.is_live
    ? `● CANLI ${r.title ?? ""} — ${r.viewers ?? "?"} izleyici — ${r.category ?? ""}`
    : `Çevrimdışı ${r.error ? "(" + r.error + ")" : ""}`, r.is_live);
}

function setStatus(message, live = false) {
  const node = $("status");
  node.replaceChildren();
  if (live) {
    const badge = document.createElement("span");
    badge.className = "live";
    badge.textContent = "● CANLI ";
    node.appendChild(badge);
    message = message.replace(/^● CANLI /, "");
  }
  node.appendChild(document.createTextNode(message));
}

async function loadStream() {
  const p = $("platform").value, c = $("channel").value.trim();
  if (!c) return;
  $("status").textContent = "Yükleniyor...";
  try {
    const preflight = await fetch(`/api/status/${p}/${encodeURIComponent(c)}`).then(response => response.json());
    setStatus(`${p} / ${c} · ${preflight.is_live ? 'CANLI' : 'durum kontrol edildi'}${preflight.viewers ? ` · ${Number(preflight.viewers).toLocaleString('tr-TR')} izleyici` : ''}${preflight.category ? ` · ${preflight.category}` : ''}`);
  } catch (_) {}
  const r = await fetch(`/api/stream/${p}/${c}`);
  if (!r.ok) { $("status").textContent = "Yayın bulunamadı / çevrimdışı."; return; }
  const info = await r.json();
  currentStream = info;
  setStatus(`● CANLI ${info.title ?? ""} ` +
    (info.ads_filtered ? "— reklam filtresi AKTİF" : "— reklamsız kaynak"), true);

  const quality = $('qualityBox');
  quality.replaceChildren();
  const auto = document.createElement('option'); auto.value = 'master'; auto.textContent = 'Otomatik kalite'; quality.appendChild(auto);
  (info.variants || []).forEach((variant, index) => {
    const option = document.createElement('option'); option.value = String(index);
    option.textContent = `${variant.quality || `Kalite ${index + 1}`}${variant.bandwidth ? ` · ${Math.round(variant.bandwidth / 1000)} kbps` : ''}`;
    quality.appendChild(option);
  });
  quality.hidden = false;
  play(info.master_playlist);
}

$('qualityBox').addEventListener('change', event => {
  if (!currentStream) return;
  const index = event.target.value;
  if (index === 'master') return play(currentStream.master_playlist);
  const variant = currentStream.variants?.[Number(index)];
  if (variant?.url) play(`/api/hls/media?url=${encodeURIComponent(variant.url)}`);
});

function play(url) {
  const video = $("video");
  if (hls) hls.destroy();
  if (Hls.isSupported()) {
    hls = new Hls(hlsConfig());
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal || !hls) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else setStatus(`Oynatma hatası: ${data.details || 'bilinmeyen hata'}`);
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    startPlayerStats();
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
  }
  video.play().catch(() => {});
}
</script>
</body>
</html>
