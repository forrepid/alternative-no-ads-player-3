[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streambridge"
version = "2.2.0"
description = "Local multi-platform HLS stream bridge and ad filter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "curl_cffi>=0.7,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "aiocache>=0.12,<1",
]

[project.scripts]
streambridge = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
